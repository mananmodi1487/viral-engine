<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="The eight sections returned by one Viral Engine run">
  <rect width="900" height="470" rx="12" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="899" height="469" rx="12" fill="none" stroke="#30363d"/>

  <circle cx="26" cy="28" r="5" fill="#f85149"/>
  <circle cx="44" cy="28" r="5" fill="#d29922"/>
  <circle cx="62" cy="28" r="5" fill="#3fb950"/>
  <text x="84" y="33" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#8b949e">viral-engine · one run, eight sections</text>
  <line x1="0" y1="50" x2="900" y2="50" stroke="#21262d"/>

  <g font-family="ui-sans-serif,system-ui,sans-serif">
    <!-- rows: y positions -->
    <g>
      <rect x="26" y="68" width="848" height="42" rx="6" fill="#161b22"/>
      <text x="46" y="95" font-size="12" font-family="ui-monospace,Menlo,monospace" fill="#6e7681">1</text>
      <text x="72" y="95" font-size="14" font-weight="600" fill="#e6edf3">THE BET</text>
      <text x="190" y="95" font-size="12.5" fill="#8b949e">what it is, who it&#8217;s for, why it spreads &#8212; in one paragraph</text>
      <text x="852" y="95" text-anchor="end" font-size="11" font-family="ui-monospace,Menlo,monospace" fill="#3fb950">100%</text>
    </g>
    <g>
      <rect x="26" y="116" width="848" height="42" rx="6" fill="#161b22"/>
      <text x="46" y="143" font-size="12" font-family="ui-monospace,Menlo,monospace" fill="#6e7681">2</text>
      <text x="72" y="143" font-size="14" font-weight="600" fill="#e6edf3">DIAGNOSIS</text>
      <text x="190" y="143" font-size="12.5" fill="#8b949e">7 levers scored 1&#8211;5 &#8212; and the bottleneck named explicitly</text>
      <text x="790" y="143" font-size="11" font-family="ui-monospace,Menlo,monospace" fill="#f85149">the honest bit</text>
    </g>
    <g>
      <rect x="26" y="164" width="848" height="42" rx="6" fill="#161b22"/>
      <text x="46" y="191" font-size="12" font-family="ui-monospace,Menlo,monospace" fill="#6e7681">3</text>
      <text x="72" y="191" font-size="14" font-weight="600" fill="#e6edf3">HOOKS</text>
      <text x="190" y="191" font-size="12.5" fill="#8b949e">3 kept from 12 drafted &#8212; each with pattern, audience, failure mode</text>
      <text x="852" y="191" text-anchor="end" font-size="11" font-family="ui-monospace,Menlo,monospace" fill="#58a6ff">screenshot&#8211;ready</text>
    </g>
    <g>
      <rect x="26" y="212" width="848" height="42" rx="6" fill="#161b22"/>
      <text x="46" y="239" font-size="12" font-family="ui-monospace,Menlo,monospace" fill="#6e7681">4</text>
      <text x="72" y="239" font-size="14" font-weight="600" fill="#e6edf3">POSITIONING</text>
      <text x="190" y="239" font-size="12.5" fill="#8b949e">&#8220;It&#8217;s not X. It&#8217;s Y.&#8221; + the frames that were rejected and why</text>
      <text x="852" y="239" text-anchor="end" font-size="11" font-family="ui-monospace,Menlo,monospace" fill="#3fb950">the hinge</text>
    </g>
    <g>
      <rect x="26" y="260" width="848" height="42" rx="6" fill="#161b22"/>
      <text x="46" y="287" font-size="12" font-family="ui-monospace,Menlo,monospace" fill="#6e7681">5</text>
      <text x="72" y="287" font-size="14" font-weight="600" fill="#e6edf3">STRUCTURE</text>
      <text x="190" y="287" font-size="12.5" fill="#8b949e">2 of 6 share mechanisms, wired into the artifact itself</text>
      <text x="790" y="287" font-size="11" font-family="ui-monospace,Menlo,monospace" fill="#8b949e">not bolted on</text>
    </g>
    <g>
      <rect x="26" y="308" width="848" height="42" rx="6" fill="#161b22"/>
      <text x="46" y="335" font-size="12" font-family="ui-monospace,Menlo,monospace" fill="#6e7681">6</text>
      <text x="72" y="335" font-size="14" font-weight="600" fill="#e6edf3">DISTRIBUTION</text>
      <text x="190" y="335" font-size="12.5" fill="#8b949e">named seed nodes, the loop, the share sentence, the backstop</text>
      <text x="852" y="335" text-anchor="end" font-size="11" font-family="ui-monospace,Menlo,monospace" fill="#d29922">no &#8220;post on social&#8221;</text>
    </g>
    <g>
      <rect x="26" y="356" width="848" height="42" rx="6" fill="#161b22"/>
      <text x="46" y="383" font-size="12" font-family="ui-monospace,Menlo,monospace" fill="#6e7681">7</text>
      <text x="72" y="383" font-size="14" font-weight="600" fill="#e6edf3">FIRST 48 HOURS</text>
      <text x="212" y="383" font-size="12.5" fill="#8b949e">a time-boxed checklist one person can execute with no budget</text>
      <text x="852" y="383" text-anchor="end" font-size="11" font-family="ui-monospace,Menlo,monospace" fill="#3fb950">do it today</text>
    </g>
    <g>
      <rect x="26" y="404" width="848" height="42" rx="6" fill="#161b22"/>
      <text x="46" y="431" font-size="12" font-family="ui-monospace,Menlo,monospace" fill="#6e7681">8</text>
      <text x="72" y="431" font-size="14" font-weight="600" fill="#e6edf3">SCORECARD</text>
      <text x="200" y="431" font-size="12.5" fill="#8b949e">3 metrics with the number that means working &#8212; and what to change if not</text>
      <text x="852" y="431" text-anchor="end" font-size="11" font-family="ui-monospace,Menlo,monospace" fill="#8b949e">one variable</text>
    </g>
  </g>
</svg>
